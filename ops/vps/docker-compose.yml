# Cyber Alert DRC — VPS stack (web + Postgres + AI gateway)
# Usage (from ops/vps):
#   cp .env.example .env
#   docker compose up -d db
#   docker compose up -d web ai

name: cyberalert

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberalert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cyberalert}
    volumes:
      - cyberalert_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberalert} -d ${POSTGRES_DB:-cyberalert}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ../../services/ai-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_GATEWAY_SECRET: ${AI_GATEWAY_SECRET:?set AI_GATEWAY_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:8090:8090"

  web:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cyberalert-rdc.org}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberalert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberalert}
      AI_GATEWAY_URL: http://ai:8090
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3010:3010"

volumes:
  cyberalert_pgdata:
