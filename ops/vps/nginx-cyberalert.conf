# nginx vhost for cyberalert.mcbuleli.org
# Place under /etc/nginx/sites-available/ and enable.
# TLS via certbot or Cloudflare origin cert.

upstream cyberalert_web {
  server 127.0.0.1:3010;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name cyberalert.mcbuleli.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cyberalert.mcbuleli.org;

  # ssl_certificate     /etc/letsencrypt/live/cyberalert.mcbuleli.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/cyberalert.mcbuleli.org/privkey.pem;

  client_max_body_size 2m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://cyberalert_web;
  }
}
