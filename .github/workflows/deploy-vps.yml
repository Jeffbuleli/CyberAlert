name: Deploy VPS (Cyber Alert DRC)

# Prod deploys ONLY from GitHub main.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Optional: VPS_REPO_DIR (default /opt/cyberalert)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cyberalert-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy via SSH (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO="${{ secrets.VPS_REPO_DIR }}"
            REPO="${REPO:-/opt/cyberalert}"
            if [[ ! -x "$REPO/ops/vps/deploy.sh" ]]; then
              chmod +x "$REPO/ops/vps/deploy.sh" || true
            fi
            if [[ ! -f "$REPO/ops/vps/deploy.sh" ]]; then
              git -C "$REPO" fetch origin main
              git -C "$REPO" checkout -B main origin/main
              chmod +x "$REPO/ops/vps/deploy.sh"
            fi
            bash "$REPO/ops/vps/deploy.sh"
